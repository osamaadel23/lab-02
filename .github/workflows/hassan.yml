name: Hello World CI

on:
  push:
  # If your default branch is 'main' instead of 'master', change it here:
    branches: [ "main" ]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo Hello World
        run: echo "Hello World"
